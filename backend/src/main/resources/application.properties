# ==========================================================
# Employee Management System - Application Configuration
# ==========================================================

spring.application.name=employee-management-system
server.port=8080

# ---------------------------------------------------------
# Database Configuration (MySQL)
# Values are pulled from environment variables where possible,
# with local-dev defaults as fallback. NEVER commit real
# credentials - override these via env vars or a local
# untracked application-local.properties file in production.
# ---------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (bundled with spring-boot-starter-jdbc)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=EmployeeManagementPool

# ---------------------------------------------------------
# CORS - allow the React dev server to call the API
# ---------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.root=INFO
logging.level.com.employeemanagement=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ---------------------------------------------------------
# Jackson
# ---------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
